
spring:
  application:
    name: configserver

  profiles:
    active: native

  cloud:
    config:
      server:
        native:
          # Falls back to local directory 'config' or classpath if CONFIG_PATH is unset
          search-locations: ${CONFIG_PATH:file:./config}

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

management:
  endpoints:
    web:
      exposure:
        include: "*"

server:
  port: 8084