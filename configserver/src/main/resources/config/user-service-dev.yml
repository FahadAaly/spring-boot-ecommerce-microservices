spring:
  mongodb:
    uri: mongodb+srv://${MONGODB_USER}:${MONGODB_PASSWORD}@ecom-user.myypphv.mongodb.net/userdb?appName=ecom-user
    database: userdb


  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 7

eureka:
  serviceUrl:
    defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true